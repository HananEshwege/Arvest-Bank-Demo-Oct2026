<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arvest · Installments · Interactive Flows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --pb-blue:#00457C; --pb-blue-d:#001B44; --pb-green:#00457C; --pb-text:#231f20; --pb-grey:#666; --pb-line:#c8cdd3; --pb-bg:#eff1f3; --link:#00457C;
  --j-blue:#1632C5; --j-teal:#1ED9D9; --chrome-text:#f1f3f7; --chrome-muted:#8a93a6;
}
html, body { height:100%; font-family:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif; }
body { background: radial-gradient(1200px 800px at 50% -10%, #2a2420 0%, #0d0d0d 60%); color:var(--chrome-text); display:flex; flex-direction:column; overflow:hidden; user-select:none; }

/* ───── demo chrome ───── */
.top { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 24px 6px; flex-shrink:0; }
.top .brand { font-size:15px; font-weight:800; letter-spacing:-.2px; white-space:nowrap; }
.top .brand span { color:var(--chrome-muted); font-weight:600; margin-left:6px; }
.top .flow-title { font-size:13px; font-weight:700; color:#fff; text-align:center; flex:1; }
.top .flow-title small { color:var(--chrome-muted); font-weight:600; margin-left:6px; }
.top .right { display:flex; align-items:center; gap:14px; white-space:nowrap; }
.counter { font-size:12px; color:var(--chrome-muted); font-variant-numeric:tabular-nums; }
.counter b { color:#fff; }
.toggle-notes { background:rgba(255,255,255,.08); color:#fff; border:none; border-radius:999px; padding:6px 12px; font:700 12px 'Nunito',sans-serif; cursor:pointer; }
.toggle-notes:hover { background:rgba(255,255,255,.16); }

.main { flex:1; display:grid; grid-template-columns:280px 1fr 300px; gap:8px; min-height:0; padding:0 18px; }
body.notes-off .main { grid-template-columns:280px 1fr 0; }
body.notes-off .notes { display:none; }

/* left: flavor picker */
.flavors { overflow-y:auto; padding:8px 4px 8px 6px; display:flex; flex-direction:column; gap:10px; }
.flavors h4 { font-size:10px; letter-spacing:.14em; color:var(--chrome-muted); font-weight:800; padding:4px 2px 0; }
.fl { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.07); border-radius:12px; padding:12px 14px; cursor:pointer; transition:background .15s, border-color .15s; }
.fl:hover { background:rgba(255,255,255,.09); }
.fl.active { background:rgba(22,50,197,.28); border-color:var(--j-blue); }
.fl .n { display:inline-flex; width:22px; height:22px; border-radius:50%; background:rgba(255,255,255,.12); color:#fff; font-size:11px; font-weight:900; align-items:center; justify-content:center; margin-right:8px; }
.fl.active .n { background:var(--j-blue); }
.fl .t { font-size:13.5px; font-weight:800; color:#fff; display:inline; }
.fl .d { font-size:11.5px; color:var(--chrome-muted); margin-top:6px; line-height:1.4; }
.cfg { margin-top:10px; display:none; border-top:1px solid rgba(255,255,255,.08); padding-top:8px; }
.fl.active .cfg { display:block; }
.cfg div { display:flex; justify-content:space-between; gap:10px; font-size:11px; padding:3px 0; }
.cfg div span:first-child { color:var(--chrome-muted); }
.cfg div span:last-child { color:#fff; font-weight:700; text-align:right; }

/* center stage */
.stage { position:relative; display:flex; align-items:center; justify-content:center; min-height:0; padding:8px 64px; }
.nav-btn { position:absolute; top:50%; transform:translateY(-50%); width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.08); color:#fff; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:5; transition:background .15s; }
.nav-btn:hover { background:rgba(255,255,255,.16); }
.nav-btn:disabled { opacity:.25; cursor:not-allowed; }
.nav-btn.left { left:6px; } .nav-btn.right { right:6px; }
.nav-btn svg { width:22px; height:22px; }

.phone { width:392px; height:min(820px, 100%); background:#0d0f14; border-radius:44px; padding:8px; box-shadow:0 50px 100px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.04) inset; position:relative; }
.phone .notch { position:absolute; top:14px; left:50%; transform:translateX(-50%); width:120px; height:28px; background:#0d0f14; border-radius:0 0 18px 18px; z-index:50; pointer-events:none; }
.phone-inner { width:100%; height:100%; border-radius:36px; overflow:hidden; background:#fff; position:relative; color:var(--pb-text); }
.screen { position:absolute; inset:0; display:flex; flex-direction:column; background:#fff; }
.scroll { flex:1; overflow-y:auto; overflow-x:hidden; }
.scroll::-webkit-scrollbar { width:4px; } .scroll::-webkit-scrollbar-thumb { background:rgba(0,0,0,.18); border-radius:2px; }

/* right: notes */
.notes { overflow-y:auto; padding:8px 6px 8px 4px; }
.note-card { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.07); border-radius:12px; padding:16px; }
.note-card .stage-lbl { font-size:10px; letter-spacing:.14em; color:var(--j-teal); font-weight:800; }
.note-card h3 { font-size:16px; font-weight:800; color:#fff; margin:6px 0 12px; line-height:1.3; }
.note-card .who-lbl { font-size:10px; letter-spacing:.14em; color:var(--chrome-muted); font-weight:800; margin-bottom:8px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
.chip { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:999px; background:rgba(255,255,255,.08); color:#fff; }
.chip i { width:8px; height:8px; border-radius:50%; display:inline-block; }
.note-card p { font-size:12.5px; line-height:1.55; color:#c9cdd6; }
.legend { margin-top:12px; font-size:11px; color:var(--chrome-muted); line-height:1.5; padding:0 4px; }

/* bottom strip */
.strip { flex-shrink:0; padding:8px 18px 12px; display:flex; gap:6px; overflow-x:auto; align-items:center; justify-content:center; }
.strip .grp { display:flex; align-items:center; gap:4px; }
.strip .grp-lbl { font-size:9.5px; letter-spacing:.1em; font-weight:800; color:var(--chrome-muted); margin:0 4px 0 8px; text-transform:uppercase; white-space:nowrap; }
.dot { width:24px; height:24px; border-radius:6px; background:rgba(255,255,255,.08); color:#c9cdd6; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
.dot:hover { background:rgba(255,255,255,.16); }
.dot.active { background:var(--j-blue); color:#fff; }
.hint { text-align:center; font-size:11px; color:var(--chrome-muted); padding-bottom:8px; flex-shrink:0; }
.hint kbd { background:rgba(255,255,255,.08); border-radius:4px; padding:1px 6px; font-family:inherit; font-size:10px; color:#fff; }

@media (max-width:1180px) { .main { grid-template-columns:230px 1fr 250px; } }
@media (max-width:700px) { .stage { padding:8px 4px; } .phone { width:min(392px, 92vw); } .nav-btn { width:36px; height:36px; } .top .brand span { display:none; } }
@media (max-width:960px) { .main, body.notes-off .main { grid-template-columns:1fr; } .flavors, .notes { display:none; } .top .flow-title { display:none; } }

/* ───── phone UI (Arvest) ───── */
.status-bar { height:44px; padding:0 28px; display:flex; align-items:center; justify-content:space-between; font-size:15px; font-weight:800; color:#000; flex-shrink:0; }
.status-bar .time { padding-top:4px; letter-spacing:-.3px; }
.status-icons { display:flex; align-items:center; gap:5px; padding-top:4px; }
.status-bar.dark { color:#fff; } .status-bar.dark svg path, .status-bar.dark svg rect { fill:#fff; } .status-bar.dark svg rect[stroke] { stroke:#fff; fill:none; }
.url-bar { height:30px; margin:0 12px 4px; background:#f3f3f3; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:12px; color:#666; flex-shrink:0; gap:6px; }
.url-bar svg { width:11px; height:11px; }
.nav-header { height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 18px; flex-shrink:0; border-bottom:1px solid #f1f1f1; background:#fff; }
.nav-header .back-btn { background:none; border:none; cursor:pointer; padding:6px 4px; width:28px; }
.nav-header .back-btn svg { width:18px; height:18px; }
.nav-header .right-slot { font-size:14px; font-weight:700; min-width:28px; text-align:right; }
.pb-logo { display:flex; align-items:center; gap:4px; }
.pb-icon { width:32px; height:21px; display:flex; align-items:flex-end; gap:2px; }
.pb-icon span { display:block; width:6px; border-radius:2px 2px 0 0; background:var(--pb-green); }
.pb-icon span:nth-child(1){height:8px} .pb-icon span:nth-child(2){height:13px} .pb-icon span:nth-child(3){height:18px} .pb-icon span:nth-child(4){height:10px;background:var(--pb-blue)}
.pb-logo-text { font-size:16px; font-weight:700; letter-spacing:.5px; color:#000; }
.pb-logo-text.arv { font-family:Georgia,"Times New Roman",serif; font-weight:400; font-size:21px; letter-spacing:3px; color:#00457C; }
.arv-app { width:24px; height:24px; border-radius:6px; background:#00457C; color:#fff; font:400 15px Georgia,serif; display:flex; align-items:center; justify-content:center; }
.pb-logo-text b { color:var(--pb-green); font-weight:900; }

.pad { padding:0 18px; }
.h-title { text-align:center; font-size:22px; font-weight:800; padding:18px 22px 6px; line-height:1.28; }
.h-sub { text-align:center; font-size:14.5px; color:#444; padding:0 24px 16px; line-height:1.45; }
.h-left { text-align:left; }
.cta-btn { display:block; width:100%; height:50px; background:var(--pb-blue); color:#fff; font:800 14px 'Nunito',sans-serif; letter-spacing:.5px; text-transform:uppercase; border:none; border-radius:3px; cursor:pointer; }
.cta-btn:hover { background:var(--pb-blue-d); }
.cta-btn:disabled { background:#a9bdd0; cursor:not-allowed; }
.cta-secondary { display:block; width:100%; text-align:center; background:none; border:none; color:var(--link); font:700 14px 'Nunito',sans-serif; text-decoration:underline; cursor:pointer; padding:14px 0 4px; }
.cta-wrap { padding:14px 18px 22px; }
.field { border:1px solid var(--pb-line); border-radius:4px; padding:8px 14px; min-height:54px; display:flex; flex-direction:column; justify-content:center; gap:2px; margin-bottom:10px; background:#fff; }
.field .label { font-size:11.5px; font-weight:600; color:#888; }
.field .val { font-size:15.5px; font-weight:600; color:var(--pb-text); border:none; outline:none; background:none; font-family:inherit; width:100%; }
.field.ro { background:#f4f5f6; }
.field.fill { cursor:text; }
.field.fill.empty .label { font-size:15.5px; }
.field.fill.empty .val { display:none; }
.otp-wrap { display:flex; gap:12px; justify-content:center; border:1px solid var(--pb-line); border-radius:4px; padding:16px; cursor:text; }
.otp-d { width:34px; height:44px; border-bottom:2px solid #231f20; font-size:24px; font-weight:900; text-align:center; line-height:44px; }
.field.fill .val::placeholder { color:#aaa; font-weight:600; }
.seg { display:flex; border:1px solid var(--pb-line); border-radius:4px; overflow:hidden; margin-bottom:10px; }
.seg div { flex:1; text-align:center; padding:12px 0; font-size:14px; font-weight:700; color:#555; cursor:pointer; }
.seg div.on { background:var(--pb-text); color:#fff; }
.row2 { display:flex; gap:10px; } .row2 .field { flex:1; }
.sec-lbl { font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#555; margin:14px 0 8px; }
.check-row { display:flex; gap:12px; align-items:flex-start; font-size:13px; line-height:1.45; color:#333; margin:10px 0; cursor:pointer; }
.check-row a, .link { color:var(--link); text-decoration:underline; font-weight:700; cursor:pointer; }
.checkbox { width:22px; height:22px; border-radius:3px; border:1.5px solid #999; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:#fff; }
.checkbox svg { display:none; width:12px; height:12px; color:#fff; }
.check-row.checked .checkbox { background:var(--pb-blue); border-color:var(--pb-blue); }
.check-row.checked .checkbox svg { display:block; }
.note-sm { font-size:12px; color:#666; line-height:1.5; }
.center { text-align:center; }

/* app home */
.promo-banner { background:#394048; color:#fff; border-radius:8px; margin:16px 16px 8px; padding:12px 14px; display:flex; gap:12px; align-items:center; cursor:pointer; box-shadow:0 0 0 0 rgba(0,149,248,.6); animation:pulse 2.2s infinite; }
@keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(0,149,248,.55)} 70%{box-shadow:0 0 0 10px rgba(0,149,248,0)} 100%{box-shadow:0 0 0 0 rgba(0,149,248,0)} }
.promo-banner svg { width:28px; height:28px; flex-shrink:0; }
.promo-banner p { font-size:13px; line-height:1.4; }
.promo-banner u { font-weight:800; }
.acct-tabs { display:flex; padding:0 24px; border-bottom:1px solid #e0e0e0; }
.acct-tabs div { flex:1; text-align:center; padding:13px 0; font-size:15px; position:relative; }
.acct-tabs div.on { font-weight:800; } .acct-tabs div.on::after { content:''; position:absolute; bottom:-1px; left:0; right:0; height:2px; background:#000; }
.acct-group { padding:14px 18px 6px; display:flex; justify-content:space-between; font-size:16px; font-weight:800; }
.acct-card { margin:8px 18px; border-top:2px solid var(--pb-blue); padding:14px 16px; display:flex; justify-content:space-between; align-items:flex-end; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.acct-card .name { font-size:14px; font-weight:700; } .acct-card .sub { font-size:12px; color:#777; } .acct-card .amt { font-size:16px; font-weight:700; }
.tabbar { display:flex; justify-content:space-around; border-top:1px solid #eee; padding:8px 0 18px; flex-shrink:0; font-size:10.5px; color:#888; }
.tabbar div { display:flex; flex-direction:column; align-items:center; gap:3px; }
.tabbar div.on { color:var(--pb-blue); font-weight:800; }
.tabbar svg { width:20px; height:20px; }

/* web landing */
.web-hero { background:linear-gradient(160deg,#001B44 0%, #00457C 120%); color:#fff; padding:26px 22px 24px; }
.web-hero .eyebrow { font-size:11px; letter-spacing:.14em; font-weight:800; opacity:.85; }
.web-hero h1 { font-size:26px; line-height:1.2; font-weight:900; margin:8px 0 10px; }
.web-hero p { font-size:14px; line-height:1.5; opacity:.95; }
.stats { display:flex; gap:10px; padding:16px 18px 4px; }
.stats div { flex:1; background:var(--pb-bg); border-radius:8px; padding:10px; text-align:center; }
.stats b { display:block; font-size:18px; font-weight:900; color:var(--pb-green); }
.stats span { font-size:11px; color:#555; }
.how { padding:10px 18px; }
.how-row { display:flex; gap:12px; padding:10px 0; border-bottom:1px solid #f0f0f0; }
.how-row .num { width:26px; height:26px; border-radius:50%; background:var(--pb-blue); color:#fff; font-size:12px; font-weight:900; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.how-row b { font-size:14px; display:block; } .how-row span { font-size:12.5px; color:#555; line-height:1.45; }

/* welcome */
.welcome-hero img { width:100%; height:190px; object-fit:cover; display:block; }
.welcome-body { padding:18px 22px 4px; text-align:center; }
.welcome-body h2 { font-size:21px; font-weight:900; line-height:1.3; margin-bottom:10px; }
.welcome-body p { font-size:14px; color:#444; line-height:1.5; margin-bottom:10px; }
.perks { padding:0 22px; }
.perk { display:flex; gap:12px; align-items:flex-start; padding:8px 0; font-size:13.5px; line-height:1.45; }
.perk .ico { width:30px; height:30px; border-radius:50%; background:#1c1c1c; color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.perk .ico svg { width:15px; height:15px; }
.perk b { display:block; }

/* loader */
.loader-wrap { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; text-align:center; }
.spinner { width:56px; height:56px; border-radius:50%; border:5px solid #e3eef8; border-top-color:var(--pb-blue); animation:spin 0.9s linear infinite; margin-bottom:22px; }
@keyframes spin { to { transform:rotate(360deg); } }
.loader-wrap h2 { font-size:20px; font-weight:800; margin-bottom:8px; }
.loader-steps { margin-top:18px; text-align:left; }
.loader-steps div { font-size:13px; color:#555; padding:5px 0; display:flex; gap:8px; align-items:center; opacity:.35; transition:opacity .3s; }
.loader-steps div.done { opacity:1; }
.loader-steps svg { width:16px; height:16px; color:var(--pb-green); }

/* offer + plans */
.amount-box { margin:4px 18px 4px; border:1px solid var(--pb-line); border-radius:4px; padding:8px 14px; }
.amount-box .label { font-size:11.5px; color:#888; font-weight:600; }
.amount-box .val { font-size:20px; font-weight:900; }
input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:4px; border-radius:2px; background:#231f20; outline:none; margin:14px 0 4px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:#231f20; cursor:pointer; border:3px solid #fff; box-shadow:0 0 0 1px #231f20; }
input[type=range]::-moz-range-thumb { width:18px; height:18px; border-radius:50%; background:#231f20; cursor:pointer; border:3px solid #fff; }
.slider-wrap { padding:0 18px; }
.slider-labels { display:flex; justify-content:space-between; font-size:11px; color:#777; }
.plan { margin:8px 18px; border:1px solid #d9dde2; background:#f6f8fa; border-radius:6px; padding:12px 14px; cursor:pointer; transition:border-color .15s, background .15s; }
.plan:hover { border-color:#9ab; }
.plan.sel { border:2px solid var(--pb-text); background:#eef5fb; padding:11px 13px; }
.plan .top-row { display:flex; justify-content:space-between; align-items:baseline; }
.plan .price { font-size:17px; font-weight:900; } .plan .price em { font-style:normal; font-size:13px; font-weight:600; color:#444; }
.plan .apr { font-size:12px; font-weight:800; color:#333; }
.plan .det { display:none; margin-top:8px; border-top:1px solid #dde3ea; padding-top:6px; }
.plan.sel .det { display:block; }
.plan .det div { display:flex; justify-content:space-between; font-size:12.5px; padding:2px 0; color:#333; }
.tag { display:inline-block; font-size:10px; font-weight:900; letter-spacing:.05em; padding:2px 7px; border-radius:4px; background:#e6f4ec; color:var(--pb-green); margin-left:6px; vertical-align:middle; }
.tag.blue { background:#e3f1fd; color:var(--pb-blue-d); }

/* simulator */
.sim-box { margin:6px 18px 0; border-radius:10px; background:var(--pb-bg); padding:14px; }
.sim-box .lbl { font-size:12px; color:#555; font-weight:700; }
.sim-amt { font-size:26px; font-weight:900; margin:2px 0 0; }
.sim-out { margin:10px 18px 0; }
.sim-plan { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #eee; font-size:13.5px; }
.sim-plan b { font-size:15px; }
.sim-plan .r { text-align:right; font-size:12px; color:#555; }
.sim-plan .r b { display:block; font-size:15px; color:var(--pb-text); }
.limit-hero { margin:10px 18px 4px; border-radius:12px; background:linear-gradient(135deg,#001B44,#00457C); color:#fff; padding:16px; }
.limit-hero .l { font-size:12px; opacity:.9; font-weight:700; } .limit-hero .v { font-size:32px; font-weight:900; line-height:1.1; }
.limit-hero .s { font-size:12px; opacity:.9; margin-top:4px; }

/* summary table */
.sum { margin:4px 18px; border:1px solid #e3e6ea; border-radius:6px; }
.sum div { display:flex; justify-content:space-between; padding:10px 14px; font-size:13.5px; border-bottom:1px solid #eef0f2; }
.sum div:last-child { border-bottom:none; }
.sum div span:first-child { color:#555; } .sum div span:last-child { font-weight:800; }

/* agreement */
.agreement-preview { margin:6px 18px; height:380px; border:1px solid #9ec9ee; overflow:hidden; border-radius:3px; }
.agreement-preview img { width:100%; display:block; }

/* card */
.card-img { display:block; width:calc(100% - 36px); margin:8px 18px 6px; border-radius:12px; box-shadow:0 10px 24px rgba(0,0,0,.18); }
.card-meta { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; padding:4px 18px 8px; }
.use-row { display:flex; gap:12px; padding:10px 18px; align-items:flex-start; }
.use-row .ico { width:30px; height:30px; border-radius:50%; background:#1c1c1c; color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.use-row .ico svg { width:15px; height:15px; }
.use-row b { font-size:14px; display:block; } .use-row span { font-size:12.5px; color:#555; line-height:1.4; }
.wallet-btn { display:flex; align-items:center; justify-content:center; gap:8px; margin:6px auto 0; width:190px; height:44px; background:#000; color:#fff; border-radius:8px; font:700 14px 'Nunito',sans-serif; cursor:pointer; border:none; }
.wallet-btn svg { width:22px; height:22px; }
.big-check { width:72px; height:72px; border-radius:50%; background:var(--pb-green); color:#fff; display:flex; align-items:center; justify-content:center; margin:40px auto 16px; }
.big-check svg { width:36px; height:36px; }

/* IDV */
.idv-steps { margin:8px 18px; }
.idv-step { display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid #f0f0f0; font-size:14px; }
.idv-step .ico { width:38px; height:38px; border-radius:10px; background:var(--pb-bg); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.idv-step .ico svg { width:20px; height:20px; color:var(--pb-text); }
.camera { margin:10px 18px; height:420px; border-radius:14px; background:#1b1f27; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.id-frame { width:270px; height:170px; border:3px solid #fff; border-radius:14px; position:relative; background:linear-gradient(135deg,#dfe7ef,#f6f8fb); box-shadow:0 0 0 999px rgba(0,0,0,.45); }
.id-frame .photo { position:absolute; left:14px; top:30px; width:66px; height:84px; border-radius:6px; background:#c3ccd6; }
.id-frame .ln { position:absolute; left:94px; height:9px; border-radius:4px; background:#c3ccd6; }
.id-frame .hdr { position:absolute; left:14px; top:10px; font-size:10px; font-weight:900; letter-spacing:.1em; color:#54606e; }
.cam-cap { position:absolute; bottom:18px; left:0; right:0; text-align:center; color:#fff; font-size:13px; font-weight:700; }
.shutter { position:absolute; bottom:48px; left:50%; transform:translateX(-50%); width:62px; height:62px; border-radius:50%; background:#fff; border:5px solid rgba(255,255,255,.4); background-clip:padding-box; cursor:pointer; }
.selfie-wrap { width:230px; height:300px; border-radius:50%; overflow:hidden; border:4px solid #fff; box-shadow:0 0 0 999px rgba(0,0,0,.5); }
.selfie-wrap img { width:100%; height:100%; object-fit:cover; }

/* account linking */
.search { margin:6px 18px 10px; height:42px; border-radius:8px; background:var(--pb-bg); display:flex; align-items:center; gap:8px; padding:0 12px; color:#888; font-size:14px; }
.search svg { width:16px; height:16px; }
.bank-list { margin:0 18px; }
.bank-item { display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid #f0f0f0; cursor:pointer; font-size:14.5px; font-weight:700; }
.bank-item:hover { background:#fafafa; }
.bank-item .lg { width:36px; height:36px; border-radius:8px; color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900; flex-shrink:0; }
.bank-item .chev { margin-left:auto; color:#aaa; }
.acct-opt { margin:8px 18px; border:1px solid #d9dde2; border-radius:6px; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
.acct-opt.sel { border:2px solid var(--pb-text); background:#eef5fb; padding:11px 13px; }
.acct-opt b { font-size:14px; display:block; } .acct-opt span { font-size:12px; color:#666; }
.verified { display:flex; gap:8px; align-items:center; margin:8px 18px; padding:10px 12px; border-radius:6px; background:#e6f4ec; color:var(--pb-green); font-size:13px; font-weight:800; }
.verified svg { width:16px; height:16px; }

/* lock screen */
.lock { position:absolute; inset:0; background:linear-gradient(170deg,#1c2a44 0%, #0d2f55 55%, #00457C 100%); color:#fff; display:flex; flex-direction:column; }
.lock .date { text-align:center; font-size:16px; font-weight:700; margin-top:22px; opacity:.9; }
.lock .clock { text-align:center; font-size:76px; font-weight:800; letter-spacing:-2px; line-height:1; margin-top:2px; }
.notif { margin:10px 12px 0; background:rgba(245,245,247,.92); color:#111; border-radius:18px; padding:12px 14px; display:flex; gap:10px; cursor:pointer; backdrop-filter:blur(10px); }
.notif .app { width:34px; height:34px; border-radius:8px; background:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.notif .app .pb-icon { width:24px; height:16px; transform:scale(.8); }
.notif .body { flex:1; font-size:13px; line-height:1.35; }
.notif .body b { font-size:13.5px; } .notif .when { font-size:11px; color:#777; float:right; }
.lock .tapme { margin-top:auto; text-align:center; font-size:12px; opacity:.75; padding-bottom:26px; }

/* SSP */
.ssp-head { background:linear-gradient(135deg,#001B44,#00457C); color:#fff; margin:12px 16px 6px; border-radius:12px; padding:16px; }
.ssp-head .l { font-size:12px; font-weight:700; opacity:.9; }
.ssp-head .v { font-size:30px; font-weight:900; line-height:1.15; }
.ssp-head .s { font-size:12px; opacity:.92; margin-top:6px; }
.bar { height:8px; border-radius:4px; background:rgba(255,255,255,.3); margin-top:10px; overflow:hidden; }
.bar i { display:block; height:100%; background:#fff; border-radius:4px; }
.ssp-sec { font-size:13px; font-weight:900; margin:14px 18px 6px; display:flex; justify-content:space-between; }
.ssp-sec a { font-size:12px; color:var(--link); font-weight:700; }
.tx { display:flex; justify-content:space-between; align-items:center; margin:0 18px; padding:11px 0; border-bottom:1px solid #eef0f2; font-size:13.5px; }
.tx .l b { display:block; font-size:14px; } .tx .l span { font-size:12px; color:#666; }
.tx .r { text-align:right; } .tx .r b { display:block; font-size:14.5px; }
.pill { display:inline-block; font-size:10.5px; font-weight:900; padding:3px 8px; border-radius:999px; }
.pill.warn { background:#fff1d6; color:#8a5a00; } .pill.ok { background:#e6f4ec; color:var(--pb-green); }
.choose-btn { font:800 12px 'Nunito',sans-serif; color:#fff; background:var(--pb-blue); border:none; border-radius:4px; padding:7px 12px; cursor:pointer; margin-top:4px; }
.banner-info { margin:10px 18px; padding:10px 12px; border-radius:6px; background:#e3f1fd; color:#0b4f86; font-size:12.5px; line-height:1.45; }
.purchase-card { margin:12px 18px 4px; border-radius:10px; background:var(--pb-bg); padding:14px; }
.purchase-card .m { font-size:12px; color:#666; font-weight:700; } .purchase-card .a { font-size:26px; font-weight:900; } .purchase-card .d { font-size:12px; color:#555; }
</style>
</head>

const chk = (txt, req=true) => `<div class="check-row${req?' req':''}" onclick="toggleCheck(this)"><div class="checkbox">${ICON.check}</div><div>${txt}</div></div>`;
const cta = (label, opts={}) => `<div class="cta-wrap"><button class="cta-btn" ${opts.gate?'data-gate="1" disabled':''} onclick="${opts.onclick||'next()'}">${label}</button>${opts.secondary?`<button class="cta-secondary" onclick="${opts.secondaryClick||'next()'}">${opts.secondary}</button>`:''}</div>`;
const field = (label, val, cls='') => `<div class="field ${cls}"><div class="label">${label}</div><input class="val" value="${val}"></div>`;

const wrap = (chrome, body, extra='') => `<div class="screen">${chrome}<div class="scroll">${body}</div>${extra}</div>`;
const APP = (back=true) => STATUS() + HEADER(back);
const WEB = (u, back=true) => STATUS() + URL(u) + HEADER(back);

S.offer = f => ({ stage:'Decision', title:'Offer: choose amount and plan', who:['jifiti','provenir'],

    cta('Continue')) });

function plansHTML(f) {
  return f.terms.map(t => { const m = pmt(ST.amount, f.apr, t), tot = m*t;
    return `<div class="plan${ST.term===t?' sel':''}" onclick="setTerm(${t})"><div class="top-row"><div class="price">${fmt(m)}<em>/mo for ${t} months</em></div><div class="apr">${f.apr}% APR</div></div>
      <div class="det"><div><span>Interest</span><span>${fmt(tot-ST.amount)}</span></div><div><span>Total of payments</span><span>${fmt(tot)}</span></div></div></div>`; }).join('');
}

function simHTML(f) {
  const a = ST.sim;
  if (a <= f.p4max) return `<div class="sim-plan"><div><b>Pay in 4</b><span class="tag">0% INTEREST</span><div class="note-sm">Every 2 weeks · no fees</div></div><div class="r"><b>${fmt(a/4)}</b>x 4</div></div>

  return f.terms.map(t => { const m = pmt(a, f.apr, t); return `<div class="sim-plan"><div><b>${t} months</b><div class="note-sm">${f.apr}% APR · interest ${fmt(m*t-a)}</div></div><div class="r"><b>${fmt(m)}</b>/mo</div></div>`; }).join('');
}

     <div class="tx"><div class="l"><b>Card controls</b><span>Lock card, wallet, limits</span></div><div class="r">›</div></div>`,

/* ═════════ flows ═════════ */
function buildFlow(f) {
  const L = [];
  if (!f.newCust) { L.push(S.appHome(f), S.welcome(f), S.confirm(f), S.loader(f,'existing')); }
  else { L.push(S.webLanding(f), S.pii(f), S.otp(f), S.income(f), S.consents(f), S.loader(f,'new')); }
  L.push(f.card==='single' ? S.offer(f) : S.simulator(f));
  if (f.newCust) L.push(S.idvStart(f), S.idCapture(f), S.selfie(f), S.idvDone(f));
  L.push(S.bankEntry(f), S.bankVerified(f), S.approved(f));
  L.push(S.agreement(f), S.card(f), S.wallet(f), S.notify(f));
  if (f.card==='single') L.push(S.sspLoan(f));
  else { L.push(S.sspHome(f), S.plan(f,0), S.plan(f,1), S.sspDone(f)); }
  return L;
}

/* ═════════ state + navigation ═════════ */
let FI = 0, FLOW = [], CUR = 0, ST = {}, IDX = {}, timer = null;

function setFlavor(i) {
  FI = i; const f = FLAVORS[i];
  ST = { amount: f.amount || 0, term: f.term || 12, sim: 300, plans: {} };
  FLOW = buildFlow(f);
  IDX = {}; FLOW.forEach((s,k)=>{ if (s.planIdx !== undefined) IDX['plan'+s.planIdx] = k; });
  document.querySelectorAll('.fl').forEach((el,k)=>el.classList.toggle('active', k===i));
  document.getElementById('flowTitle').innerHTML = `${i+1}. ${f.name}<small>${f.who}</small>`;
  document.getElementById('totIdx').textContent = FLOW.length;
  buildStrip(); go(0);
}

function buildStrip() {
  const strip = document.getElementById('strip'); strip.innerHTML = '';
  let grp = null, last = null;
  FLOW.forEach((s,k)=>{
    if (s.stage !== last) { grp = document.createElement('div'); grp.className='grp'; grp.innerHTML = `<span class="grp-lbl">${s.stage}</span>`; strip.appendChild(grp); last = s.stage; }
    const d = document.createElement('div'); d.className='dot'; d.textContent = k+1; d.title = s.title; d.onclick = ()=>go(k); grp.appendChild(d);
  });
}

function render() {
  clearTimeout(timer);
  const s = FLOW[CUR];
  document.getElementById('phone').innerHTML = s.html();
  document.getElementById('curIdx').textContent = CUR+1;
  document.getElementById('prevBtn').disabled = CUR===0;
  document.getElementById('nextBtn').disabled = CUR===FLOW.length-1;
  document.getElementById('nStage').textContent = s.stage.toUpperCase() + ' · STEP ' + (CUR+1);
  document.getElementById('nTitle').textContent = s.title;
  document.getElementById('nWho').innerHTML = s.who.map(w=>`<span class="chip"><i style="background:${P[w].c}"></i>${P[w].n}</span>`).join('');
  document.getElementById('nText').textContent = s.note;
  document.querySelectorAll('.dot').forEach((d,k)=>d.classList.toggle('active', k===CUR));
  const ad = document.querySelector('.dot.active'); if (ad) ad.scrollIntoView({ block:'nearest', inline:'center' });
  if (s.auto) {
    const steps = document.querySelectorAll('.loader-steps div'); const per = s.auto / (steps.length+1);
    steps.forEach((el,k)=> setTimeout(()=>{ if (FLOW[CUR]===s) el.classList.add('done'); }, per*(k+1)));
    timer = setTimeout(()=>{ if (FLOW[CUR]===s) next(); }, s.auto);
  }
}
function go(i) { if (i<0 || i>=FLOW.length) return; CUR = i; render(); }
function next() { go(CUR+1); }
function prev() { go(CUR-1); }

/* interactions */
function toggleCheck(el) {
  el.classList.toggle('checked');
  gateFill(el.closest('.screen'));
}
function setAmount(v) { ST.amount = parseInt(v,10); document.getElementById('amtVal').textContent = fmt0(ST.amount); document.getElementById('plans').innerHTML = plansHTML(FLAVORS[FI]); }
function setTerm(t) { ST.term = t; document.getElementById('plans').innerHTML = plansHTML(FLAVORS[FI]); }
function setSim(v) { ST.sim = parseInt(v,10); document.getElementById('simAmt').textContent = fmt0(ST.sim); document.getElementById('simOut').innerHTML = simHTML(FLAVORS[FI]); }
function setPlan(i,k) { ST.plans[i] = k; render(); }
function confirmPlan(i) { const f = FLAVORS[FI]; if (!ST.plans[i]) ST.plans[i] = f.purchases[i].a <= f.p4max ? 'p4' : 't12'; next(); }
function fillIn(el) {
  const scr = el.closest('.screen');
  scr.querySelectorAll('.field.fill').forEach(f=>{ const i=f.querySelector('input'); if (!i.value) i.value = f.dataset.demo; f.classList.remove('empty'); });
  scr.querySelectorAll('.otp-d').forEach(d=>{ if (!d.textContent) d.textContent = d.dataset.demo; });
  gateFill(scr);
}
function gateFill(scr) {
  const fills = scr.querySelectorAll('.field.fill input'); const req = scr.querySelectorAll('.check-row.req');
  const otps = scr.querySelectorAll('.otp-d');
  const ok = [...fills].every(i=>i.value) && [...otps].every(d=>d.textContent) && [...req].every(r=>r.classList.contains('checked'));
  scr.querySelectorAll('[data-gate]').forEach(b=>b.disabled = !ok);
}
function segPick(e) { const d = e.target.closest('.seg div'); if (!d) return; d.parentElement.querySelectorAll('div').forEach(x=>x.classList.remove('on')); d.classList.add('on'); }
function pickAcct(el) { el.parentElement.querySelectorAll('.acct-opt').forEach(a=>a.classList.remove('sel')); el.classList.add('sel'); }
function toggleNotes() { document.body.classList.toggle('notes-off'); document.getElementById('notesBtn').textContent = document.body.classList.contains('notes-off') ? 'Show notes' : 'Hide notes'; }

/* flavor picker */
const flEl = document.getElementById('flavors');
FLAVORS.forEach((f,i)=>{
  const d = document.createElement('div'); d.className='fl';
  d.innerHTML = `<span class="n">${i+1}</span><div class="t">${f.name}</div><div class="d"><b style="color:#fff">${f.who}.</b> ${f.short}</div><div class="cfg">${f.cfg.map(([a,b])=>`<div><span>${a}</span><span>${b}</span></div>`).join('')}</div>`;
  d.onclick = ()=>setFlavor(i); flEl.appendChild(d);
});

document.getElementById('prevBtn').onclick = prev;
document.getElementById('nextBtn').onclick = next;
document.addEventListener('keydown', e=>{
  if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key==='ArrowRight') { e.preventDefault(); next(); }
  if (e.key==='ArrowLeft') { e.preventDefault(); prev(); }
  if (['1','2','3','4'].includes(e.key)) setFlavor(parseInt(e.key)-1);
  if (e.key==='n' || e.key==='N') toggleNotes();
});
const hm = (location.hash||'').match(/flavor([1-4])/); const q = hm ? hm[1] : new URLSearchParams(location.search).get('flavor');
setFlavor(q && q>=1 && q<=4 ? q-1 : 0);
</script>
